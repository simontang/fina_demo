log_format agent_dist '$remote_addr [$time_local] "$request" $status $upstream_addr aff=$http_x_axiom_affinity urt=$upstream_response_time';
map $http_x_axiom_affinity $agent_key {
    ""      $request_id;
    default $http_x_axiom_affinity;
}
upstream agent_cluster {
    hash $agent_key consistent;
    server 127.0.0.1:5702 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5712 max_fails=3 fail_timeout=15s;
    keepalive 64;
}
