services:
  postgres:
    image: fina-offline/postgres:15-alpine
    container_name: fina-postgres
    environment:
      POSTGRES_USER: fina
      POSTGRES_PASSWORD: fina_local_2024
      POSTGRES_DB: fina_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina -d fina_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    image: fina-offline/agent:latest
    container_name: fina-agent
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: "5702"
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://fina:fina_local_2024@postgres:5432/fina_db
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fina_db
      DB_USER: fina
      DB_PASSWORD: fina_local_2024
      # LLM configuration (required)
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      API_KEY3: ${API_KEY3:?API_KEY3 is required}
      # Sandbox configuration (local all-in-one-sandbox)
      SANDBOX_PROVIDER_TYPE: remote
      REMOTE_BASE_URL: http://sandbox:8080
    volumes:
      - ./uploads:/app/uploads
      - ./lattice_store:/app/lattice_store
    ports:
      - "5702:5702"
    restart: unless-stopped

  sandbox:
    image: fina-offline/all-in-one-sandbox:latest
    container_name: fina-sandbox
    ports:
      - "8080:8080"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  ai_web_fina:
    image: fina-offline/ai-web:latest
    container_name: fina-web
    depends_on:
      - agent
    volumes:
      - ./configs/fina/config.json:/usr/share/nginx/html/config.json:ro
      - ./configs/fina/logo.png:/usr/share/nginx/html/logo.png:ro
      - ./configs/fina/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    ports:
      - "5701:5701"
    restart: unless-stopped

volumes:
  postgres_data:
