server:
  port: ${SERVER_PORT:5705}
  servlet:
    context-path: /

spring:
  application:
    name: b1s
  datasource:
    # Master datasource (PostgreSQL Aliyun RDS) — stores t_datasource_config and t_metrics_meta
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://pgm-uf615169n98t95tflo.pg.rds.aliyuncs.com:5432/postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres_fuli}
    password: ${SPRING_DATASOURCE_PASSWORD:jfd4whz@GPF2nqx7zhm}
    hikari:
      pool-name: master-pg-pool
      maximum-pool-size: ${MASTER_POOL_MAX:10}
      minimum-idle: ${MASTER_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    default-property-inclusion: always
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

metrics:
  encryption:
    key: ${ENCRYPT_KEY:fina-metrics-2024!}
  skip-init: ${SKIP_INIT:false}
  master-schema-init: ${MASTER_SCHEMA_INIT:true}
  datasource-type: ${METRICS_DATASOURCE_TYPE:SQLSERVER}

b1:
  proxy:
    log-request-body-on-error: ${B1_PROXY_LOG_REQUEST_BODY_ON_ERROR:true}
    max-request-body-log-chars: ${B1_PROXY_MAX_REQUEST_BODY_LOG_CHARS:8000}
  service-layer:
    base-url: ${B1_SERVICE_LAYER_BASE_URL:https://tengnat.yiyuntong.net:13450/b1s/v1}
    default-company-db: ${B1_COMPANY_DB:SBODemoUS}
    default-username: ${B1_USERNAME:manager}
    default-password: ${B1_PASSWORD:1124}
    company-credentials:
      XSM_ZSK:
        username: ${B1_XSM_ZSK_USERNAME:${B1_USERNAME:manager}}
        password: ${B1_XSM_ZSK_PASSWORD:${B1_PASSWORD:1124}}
      SBODemoUS:
        username: ${B1_SBODEMOUS_USERNAME:manager}
        password: ${B1_SBODEMOUS_PASSWORD:Abcd@123}
    connect-timeout: ${B1_CONNECT_TIMEOUT:10s}
    read-timeout: ${B1_READ_TIMEOUT:60s}

mail:
  listener:
    enabled: ${MAIL_LISTENER_ENABLED:false}
    imap-host: ${MAIL_IMAP_HOST:imap.larksuite.com}
    imap-port: ${MAIL_IMAP_PORT:993}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    folder: ${MAIL_FOLDER:INBOX}
    poll-interval: ${MAIL_POLL_INTERVAL:10s}
    poll-interval-ms: ${MAIL_POLL_INTERVAL_MS:10000}
    batch-size: ${MAIL_BATCH_SIZE:20}
    mark-seen: ${MAIL_MARK_SEEN:true}
    dispatch-thread-pool-size: ${MAIL_DISPATCH_THREAD_POOL_SIZE:4}
    dispatch-queue-capacity: ${MAIL_DISPATCH_QUEUE_CAPACITY:100}

tos:
  enabled: ${TOS_ENABLED:${S3_ENABLED:false}}
  endpoint: ${TOS_ENDPOINT:${S3_ENDPOINT:}}
  region: ${TOS_REGION:${S3_REGION:}}
  access-key: ${TOS_ACCESS_KEY:${S3_ACCESS_KEY:}}
  secret-key: ${TOS_SECRET_KEY:${S3_SECRET_KEY:}}
  bucket: ${TOS_BUCKET:${S3_BUCKET:}}
  key-prefix: ${TOS_KEY_PREFIX:${S3_KEY_PREFIX:b1s/mail-attachments}}

document-service:
  enabled: ${DOCUMENT_SERVICE_ENABLED:false}
  base-url: ${DOCUMENT_SERVICE_BASE_URL:https://ada.alphafina.cn/api/documents}
  engine: ${DOCUMENT_SERVICE_ENGINE:datalab}
  mode: ${DOCUMENT_SERVICE_MODE:accurate}
  language-hints: ${DOCUMENT_SERVICE_LANGUAGE_HINTS:en}
  connect-timeout-ms: ${DOCUMENT_SERVICE_CONNECT_TIMEOUT_MS:15000}
  read-timeout-ms: ${DOCUMENT_SERVICE_READ_TIMEOUT_MS:600000}
  poll-interval-ms: ${DOCUMENT_SERVICE_POLL_INTERVAL_MS:3000}
  max-wait-ms: ${DOCUMENT_SERVICE_MAX_WAIT_MS:180000}

llm:
  intent:
    enabled: ${LLM_INTENT_ENABLED:false}
    endpoint: ${LLM_INTENT_ENDPOINT:https://llm.alphafina.cn/v1/messages}
    bearer-token: ${LLM_INTENT_BEARER_TOKEN:}
    model: ${LLM_INTENT_MODEL:kimi-k2.6}
    max-tokens: ${LLM_INTENT_MAX_TOKENS:128}
    anthropic-version: ${LLM_INTENT_ANTHROPIC_VERSION:2023-06-01}

agent:
  run:
    enabled: ${AGENT_RUN_ENABLED:false}
    base-url: ${AGENT_RUN_BASE_URL:https://ada.alphafina.cn}
    bearer-token: ${AGENT_RUN_BEARER_TOKEN:}
    tenant-id: ${AGENT_RUN_TENANT_ID:tenant_2}
    channel-installation-id: ${AGENT_RUN_CHANNEL_INSTALLATION_ID:0f13c809-86bb-410b-ac8e-946be7772ba6}
    connect-timeout-ms: ${AGENT_RUN_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${AGENT_RUN_READ_TIMEOUT_MS:600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  file:
    path: ${LOG_DIR:./logs}
  level:
    com.fina.b1s: ${LOG_LEVEL:INFO}
    com.baomidou.mybatisplus: WARN
