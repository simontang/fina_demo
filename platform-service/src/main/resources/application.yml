server:
  port: ${FILE_SERVICE_PORT:5707}

spring:
  application:
    name: platform-service
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:512MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:512MB}
  datasource:
    # Metadata storage (PostgreSQL). Shared database, same pattern as
    # metrics-server / document_service; tables managed by Flyway.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://document-postgres:5432/file_service?stringtype=unspecified}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:document}
    password: ${SPRING_DATASOURCE_PASSWORD:document}
    hikari:
      pool-name: platform-service-pool
      maximum-pool-size: ${FILE_POOL_MAX:10}
      minimum-idle: ${FILE_POOL_MIN:2}
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  mvc:
    formcontent:
      # Spring Boot registers FormContentFilter for PUT/PATCH/DELETE with
      # application/x-www-form-urlencoded (HTML form _method override). It
      # consumes the request body, which silently emptied raw-stream PUT
      # uploads whose caller did not set an explicit Content-Type. We do not
      # need form overrides; keep the body intact for raw uploads.
      filter:
        enabled: false
  flyway:
    # V* files under classpath:db/migration apply automatically at startup.
    # baseline-on-migrate lets an existing (pre-Flyway) database adopt
    # cleanly: its schema is stamped at version 1 (V1 skipped there) while
    # fresh databases run V1 from scratch.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

file:
  # Shared secret for machine callers. Blank disables the check (local dev only).
  api-key: ${FILE_SERVICE_API_KEY:}
  # Storage backend. Env names mirror document_service so the same MinIO/S3
  # settings can be shared across services.
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://document-minio:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:files}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:minio}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:minio123}
    force-path-style: ${OBJECT_STORAGE_FORCE_PATH_STYLE:true}
  tenant:
    # When set (dev convenience, fuli_survey style), requests without
    # X-Tenant-Id are attributed to this tenant. Keep blank in production.
    default-tenant: ${FILE_SERVICE_DEFAULT_TENANT:}
  link:
    # Download-link mode:
    #   auto    (default) presign for internet-reachable storage (TOS/S3),
    #                     our own ticket link for self-hosted/internal
    #                     endpoints (e.g. document-minio) — decided per
    #                     request from the storage host + PUBLIC_FILE_BASE_URL
    #   presign           always storage-native signed URL
    #   ticket            always our own platform link
    mode: ${FILE_LINK_MODE:auto}
    # HMAC secret for ticket tokens. CHANGE IN PRODUCTION.
    secret: ${FILE_LINK_SECRET:file-link-demo-secret-change-me}
    # Default/max TTL for links (seconds).
    default-ttl-seconds: ${FILE_LINK_TTL:3600}
    max-ttl-seconds: ${FILE_LINK_MAX_TTL:604800}
    # Optional public host rewrite for presigned URLs (document_service's
    # PUBLIC_PRESIGN_BASE_URL pattern).
    public-base-url: ${PUBLIC_FILE_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.fina.platform: ${LOG_LEVEL:INFO}

# Svix webhook server (compose-internal). The wrapper in
# com.fina.platform.webhooks is the only caller.
svix:
  server-url: ${SVIX_SERVER_URL:http://svix-server:8071}
  jwt-secret: ${SVIX_JWT_SECRET:svix-demo-jwt-secret-change-me}
  org-id: ${SVIX_ORG_ID:org_23platformdemo0000000000}
