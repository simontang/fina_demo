# HTTP server - redirect to HTTPS (only for domain name)
server {
    listen 80;
    server_name demo.alphafina.cn;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# Fallback HTTP server for IP access (without SSL) - must be before HTTPS server
server {
    listen 80 default_server;
    server_name _;

    # Metrics API — Java Spring Boot service (5704), must be before /api block
    # Trailing slash in proxy_pass strips /api/metrics so backend receives e.g. /api/v1/datasources
    location /api/metrics/ {
        proxy_pass http://127.0.0.1:5704/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
    location = /api/metrics {
        return 301 $scheme://$host/api/metrics/;
    }

    # API 代理 - 转发到 agent 服务（必须在其他 location 之前，优先匹配）
    # Agent 服务统一处理所有 API 请求：
    # - /api/v1/* -> 代理到 Python prediction_app (5703)
    # - /api/bff/* -> LatticeGateway endpoints
    # - /api/rtc/* -> RTC/语音聊天 endpoints
    # - /api/agents/*, /api/files/*, /api/datasets/* -> BFF endpoints
    location /api {
        proxy_pass http://127.0.0.1:5702;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Support streaming responses / SSE if needed
        proxy_buffering off;
        
        # Increase timeout for long-running requests (AI insights may take time)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Web UI - 前端应用 (SPA under /admin/)
    # Redirect root to /admin
    location = / {
        return 301 /admin/;
    }
    
    # Proxy /admin to ai_web service
    location /admin {
        proxy_pass http://127.0.0.1:5701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Don't follow redirects from backend
        proxy_redirect off;
    }

    # Redirect legacy /data-agent to admin Data Agent page
    location /data-agent {
        return 301 /admin/agents/data;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy /sandbox/global to localhost:8080
    location /sandbox/global {
        rewrite ^/sandbox/global/?(.*) /$1 break;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
server {
    listen 443 ssl http2;
    server_name demo.alphafina.cn;
    
    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/demo.alphafina.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/demo.alphafina.cn.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Metrics API — Java Spring Boot service (5704), must be before /api block
