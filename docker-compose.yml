x-document-service-env: &document-service-env
  DATABASE_URL: ${DOCUMENT_DATABASE_URL:-postgresql+psycopg://document:document@document-postgres:5432/document_service}
  REDIS_URL: ${DOCUMENT_REDIS_URL:-redis://document-redis:6379/0}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://document-minio:9000}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-documents}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minio}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minio123}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  PUBLIC_PRESIGN_BASE_URL: ${PUBLIC_PRESIGN_BASE_URL:-}
  PRESIGNED_URL_TTL_SECONDS: ${PRESIGNED_URL_TTL_SECONDS:-3600}
  DATALAB_API_KEY: ${DATALAB_API_KEY:-}
  DATALAB_BASE_URL: ${DATALAB_BASE_URL:-https://www.datalab.to}
  MINERU_TOKEN: ${MINERU_TOKEN:-}
  MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net}
  MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
  TEXTIN_APP_ID: ${TEXTIN_APP_ID:-}
  TEXTIN_SECRET_CODE: ${TEXTIN_SECRET_CODE:-}
  TEXTIN_BASE_URL: ${TEXTIN_BASE_URL:-https://api.textin.com}
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  QWEN_MODEL: ${QWEN_MODEL:-qwen3.5-ocr}
  PADDLEOCR_API_URL: ${PADDLEOCR_API_URL:-}
  PADDLEOCR_TOKEN: ${PADDLEOCR_TOKEN:-}
  PADDLEOCR_MODEL: ${PADDLEOCR_MODEL:-PaddleOCR-VL-1.6}
  LOCAL_DOCX_TO_PDF_ENABLED: ${LOCAL_DOCX_TO_PDF_ENABLED:-true}
  LIBREOFFICE_BINARY: ${LIBREOFFICE_BINARY:-soffice}

services:
  prediction_app:
    build:
      context: .
      dockerfile: prediction_app/Dockerfile
    environment:
      PORT: "5703"
      # Optional (only required if you want AI explanations/insights).
      VOLCENGINE_API_KEY2: ${VOLCENGINE_API_KEY2:-a0533576-d6ed-4ca4-a308-473cbf7ebd10}
      VOLCENGINE_BASE_URL: ${VOLCENGINE_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      VOLCENGINE_MODEL: ${VOLCENGINE_MODEL:-kimi-k2-250905}
    volumes:
      - ./uploads:/app/uploads
    ports:
      # Exposed for debugging; the UI talks to the agent which reverse-proxies to this service.
      - "5703:5703"
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      PORT: "5702"
      PYTHON_API_URL: http://prediction_app:5703
      CDP_API_URL: http://cdp-service:5706
      UPLOAD_DIR: /app/uploads
      # Optional (LLM provider for the agent + some Python insight endpoints).
      VOLCENGINE_API_KEY2: ${VOLCENGINE_API_KEY2:-a0533576-d6ed-4ca4-a308-473cbf7ebd10}
      VOLCENGINE_API_URL: ${VOLCENGINE_API_URL:-https://ark.cn-beijing.volces.com/api/v3}
      VOLCENGINE_MODEL: ${VOLCENGINE_MODEL:-kimi-k2-250905}
      # Optional (RTC Voice Chat)
      VOLCENGINE_APP_ID: ${VOLCENGINE_APP_ID:-691afa7690b35401752447aa}
      VOLCENGINE_APP_KEY: ${VOLCENGINE_APP_KEY:-183a248afa964e3e97487bae14e506d2}
      VOLC_ACCESSKEY: ${VOLC_ACCESSKEY:-AKLTOTY3ZmIyNzJlY2ExNGM0NzllNTc5NmEyMmVjMzNiYzM}
      VOLC_SECRETKEY: ${VOLC_SECRETKEY:-TlRsaU5EVTNZV1U1WkRSbE5HSXhOamcyT1RnM1lqWTNZVEEzTmpBME5XTQ==}
      VOLC_REGION: ${VOLC_REGION:-cn-north-1}
      VOLC_RTC_API_URL: ${VOLC_RTC_API_URL:-https://rtc.volcengineapi.com}
      VOLC_SPEECH_APP_ID: ${VOLC_SPEECH_APP_ID:-4989755477}
      VOLC_SPEECH_ACCESS_TOKEN: ${VOLC_SPEECH_ACCESS_TOKEN:-xBwUO8jqYz4rnhiHqK7H70dM6UbOHef5}
      VOLC_SPEECH_SECRET_KEY: ${VOLC_SPEECH_SECRET_KEY:-pKwgSeDlNCJ63EGHAbbay9XJny8OoQtp}
      VOLC_TTS_VOICE_TYPE: ${VOLC_TTS_VOICE_TYPE:-zh_male_xudong_conversation_wvae_bigtts}
      COZEBOT_APIKEY: ${COZEBOT_APIKEY:-sat_0FzxnRegEwyTUTt4rd7DzLioyys5NKYTNNsy1tptNblbfE9kZxSY4VPDrucMhNEK}
      COZEBOT_BOT_ID: ${COZEBOT_BOT_ID:-7597420991484379170}
      COZEBOT_URL: ${COZEBOT_URL:-https://api.coze.cn}
      VOICE_WELCOME_MESSAGE: ${VOICE_WELCOME_MESSAGE:-Hello! I'm here to help with B2B order status, credit limits, and stock transfers—let's optimize your operations!}
      # Microsandbox Remote Configuration
      SANDBOX_PROVIDER_TYPE: ${SANDBOX_PROVIDER_TYPE:-microsandbox-remote}
      MICROSANDBOX_SERVICE_BASE_URL: ${MICROSANDBOX_SERVICE_BASE_URL:-http://38.76.211.27:4002}
      MICROSANDBOX_API_KEY: ${MICROSANDBOX_API_KEY:-qwertyuiop1234567890}
      MICROSANDBOX_MEMORY: ${MICROSANDBOX_MEMORY:-1024}
      MICROSANDBOX_IMAGE: ${MICROSANDBOX_IMAGE:-kioko12520/sandbox:0.1.0}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - prediction_app
      - cdp_service
    ports:
      - "5702:5702"
    restart: unless-stopped

  metrics_server:
    build:
      context: ./metrics-server
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "5704"
      # Master PostgreSQL (Aliyun RDS) — stores datasource configs & metric definitions
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://pgm-uf615169n98t95tflo.pg.rds.aliyuncs.com:5432/postgres}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres_fuli}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # AES key for encrypting SAP B1 HANA passwords at rest
      ENCRYPT_KEY: ${ENCRYPT_KEY:-fina-metrics-2024!}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SKIP_INIT: ${SKIP_INIT:-false}
    volumes:
      - ./logs/metrics-server:/app/logs
    ports:
      - "5704:5704"
    restart: unless-stopped

  b1s:
    build:
      context: ./b1s
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "5705"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://pgm-uf615169n98t95tflo.pg.rds.aliyuncs.com:5432/postgres}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres_fuli}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      METRICS_DATASOURCE_TYPE: SQLSERVER
      ENCRYPT_KEY: ${ENCRYPT_KEY:-fina-metrics-2024!}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SKIP_INIT: ${SKIP_INIT:-false}
      B1_SERVICE_LAYER_BASE_URL: ${B1_SERVICE_LAYER_BASE_URL:-https://tengnat.yiyuntong.net:13450/b1s/v1}
      B1_COMPANY_DB: ${B1_COMPANY_DB:-XSM_ZSK}
      B1_USERNAME: ${B1_USERNAME:-manager}
      B1_PASSWORD: ${B1_PASSWORD:-1124}
      DOCUMENT_SERVICE_ENABLED: ${DOCUMENT_SERVICE_ENABLED:-false}
      DOCUMENT_SERVICE_BASE_URL: ${DOCUMENT_SERVICE_BASE_URL:-http://document-api:5710}
      DOCUMENT_SERVICE_ENGINE: ${DOCUMENT_SERVICE_ENGINE:-auto}
      DOCUMENT_SERVICE_MODE: ${DOCUMENT_SERVICE_MODE:-accurate}
      DOCUMENT_SERVICE_LANGUAGE_HINTS: ${DOCUMENT_SERVICE_LANGUAGE_HINTS:-en}
      DOCUMENT_SERVICE_CONNECT_TIMEOUT_MS: ${DOCUMENT_SERVICE_CONNECT_TIMEOUT_MS:-15000}
      DOCUMENT_SERVICE_READ_TIMEOUT_MS: ${DOCUMENT_SERVICE_READ_TIMEOUT_MS:-600000}
      DOCUMENT_SERVICE_POLL_INTERVAL_MS: ${DOCUMENT_SERVICE_POLL_INTERVAL_MS:-3000}
      DOCUMENT_SERVICE_MAX_WAIT_MS: ${DOCUMENT_SERVICE_MAX_WAIT_MS:-180000}
    volumes:
      - ./logs/b1s:/app/logs
    ports:
      - "5705:5705"
    restart: unless-stopped

  cdp_service:
    build:
      context: ./cdp-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "5706"
      # Master PostgreSQL stores datasource configs, segment definitions, and segment snapshots.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://pgm-uf615169n98t95tflo.pg.rds.aliyuncs.com:5432/postgres}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres_fuli}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      ENCRYPT_KEY: ${ENCRYPT_KEY:-fina-metrics-2024!}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SKIP_INIT: ${SKIP_INIT:-false}
    volumes:
      - ./logs/cdp-service:/app/logs
    ports:
      - "5706:5706"
    networks:
      default:
        aliases:
          - cdp-service
    restart: unless-stopped

  document-api:
    build:
      context: ./document_service
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 5710
    environment: *document-service-env
    depends_on:
      document-postgres:
        condition: service_started
      document-redis:
        condition: service_started
      document-minio-init:
        condition: service_completed_successfully
    ports:
      - "${DOCUMENT_SERVICE_PORT:-5710}:5710"
    restart: unless-stopped

  document-worker:
    build:
      context: ./document_service
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    environment: *document-service-env
    depends_on:
      document-postgres:
        condition: service_started
      document-redis:
        condition: service_started
      document-minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  document-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: document_service
      POSTGRES_USER: document
      POSTGRES_PASSWORD: document
    volumes:
      - document_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  document-redis:
    image: redis:7
    restart: unless-stopped

  document-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minio123}
    ports:
      - "5718:9000"
      - "5719:9001"
    volumes:
      - document_minio:/data
    restart: unless-stopped

  document-minio-init:
    image: minio/mc
    depends_on:
      - document-minio
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minio123}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://document-minio:9000 \"${OBJECT_STORAGE_ACCESS_KEY:-minio}\" \"${OBJECT_STORAGE_SECRET_KEY:-minio123}\"; do sleep 1; done;
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-documents};
      "

  ai_web_fina:
    build:
      context: ./ai_web
      dockerfile: Dockerfile
    depends_on:
      - agent
    volumes:
      - ./configs/fina/config.json:/usr/share/nginx/html/config.json
      - ./configs/fina/logo.png:/usr/share/nginx/html/logo.png
      - ./configs/fina/favicon.ico:/usr/share/nginx/html/favicon.ico
    ports:
      - "5701:5701"
    restart: unless-stopped

  ai_web_evario:
    build:
      context: ./ai_web
      dockerfile: Dockerfile
    depends_on:
      - agent
    volumes:
      - ./configs/evario/config.json:/usr/share/nginx/html/config.json
      - ./configs/evario/logo.png:/usr/share/nginx/html/logo.png
      - ./configs/evario/favicon.ico:/usr/share/nginx/html/favicon.ico
    ports:
      - "5711:5701"
    restart: unless-stopped

volumes:
  document_pgdata:
  document_minio:
