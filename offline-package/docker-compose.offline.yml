services:
  postgres:
    image: fina-offline/postgres:15-alpine
    container_name: fina-postgres
    environment:
      POSTGRES_USER: fina
      POSTGRES_PASSWORD: fina_local_2024
      POSTGRES_DB: fina_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina -d fina_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    image: fina-offline/agent:latest
    container_name: fina-agent
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      LOG_LEVEL: INFO
      PORT: "5702"
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://fina:fina_local_2024@postgres:5432/fina_db
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fina_db
      DB_USER: fina
      DB_PASSWORD: fina_local_2024
      # LLM configuration (loaded from .env file)
      LLM_BASE_URL: ${LLM_BASE_URL}
      API_KEY3: ${API_KEY3}
      # 模型列表
      MODEL_LIST: qwen3.6-27b,qwen3.6-35b-a3b
      DEFAULT_MODEL: qwen3.6-27b
      # Sandbox configuration
      SANDBOX_PROVIDER_TYPE: remote
      SANDBOX_BASE_URL: http://sandbox:8080
      # CozeBot
      COZEBOT_APIKEY: sat_0FzxnRegEwyTUTt4rd7DzLioyys5NKYTNNsy1tptNblbfE9kZxSY4VPDrucMhNEK
      COZEBOT_BOT_ID: "7597420991484379170"
      # Other
      TAVILY_API_KEY: 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
      VOICE_WELCOME_MESSAGE: "Hello! I'm here to help with B2B order status, credit limits, and stock transfers—let's optimize your operations!"
      AUTH_REQUIRED: "false"
      LATTICE_ENCRYPTION_KEY: deep-research-encryption-key-change-in-production!
      JWT_SECRET: fuli-agent-secret-key-change-in-production-environment
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/agent/logs
    ports:
      - "5702:5702"
    restart: unless-stopped

  sandbox:
    image: fina-offline/all-in-one-sandbox:latest
    container_name: fina-sandbox
    ports:
      - "8080:8080"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  ai_web_fina:
    image: fina-offline/ai-web:latest
    container_name: fina-web
    depends_on:
      - agent
    volumes:
      - ./configs/fina/config.json:/usr/share/nginx/html/config.json:ro
      - ./configs/fina/logo.png:/usr/share/nginx/html/logo.png:ro
      - ./configs/fina/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    ports:
      - "5701:5701"
    restart: unless-stopped

volumes:
  postgres_data:
